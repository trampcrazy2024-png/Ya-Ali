# Project-wide Gradle settings

# Stable Android build in Codespace
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

# Keep Gradle memory bounded because the Codespace has ~8 GiB RAM and no swap.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Reduce background Gradle memory pressure.
org.gradle.vfs.watch=false
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=true
