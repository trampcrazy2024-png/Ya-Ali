name: Build Ya Ali Android
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Install npm dependencies
        run: npm ci
      - name: Web build
        run: npm run build
      - name: Capacitor sync
        run: npx cap sync android
      - name: Android debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4096m
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ya-ali-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
