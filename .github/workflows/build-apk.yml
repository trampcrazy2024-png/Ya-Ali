name: Build Android Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci
      # Bug fix: this workflow used to run `gradle assembleDebug`
      # directly, without ever building the web app or running
      # `npx cap sync android` first, so the APK packaged whatever
      # (possibly stale, possibly absent) assets already happened to
      # be committed under android/app/src/main/assets/public instead
      # of the current apps/mobile build output.
      - name: Build web app and sync into the Android project
        run: npm run android:sync

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ya-ali-debug-apk
          path: 'android/app/build/outputs/apk/**/*.apk'
